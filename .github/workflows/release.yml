name: Build downloads

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the files to'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

concurrency:
  group: build-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Make sure the release exists
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it is not there yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Spreadsheet Pro ${TAG#v}" --generate-notes

  jar:
    name: Runnable jar
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the jar
        run: |
          V="${TAG#v}"
          mkdir out
          javac --release 11 -encoding UTF-8 -d out *.java
          printf 'Main-Class: SpreadsheetApp\nImplementation-Version: %s\n' "$V" > manifest.txt
          jar cfm SpreadsheetPro.jar manifest.txt -C out . -C resources .

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: SpreadsheetPro.jar

      - name: Attach jar and icon to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" SpreadsheetPro.jar --clobber
          if [ -f "resources/icon.ico" ]; then
            gh release upload "$TAG" resources/icon.ico --clobber
          fi

  bundle:
    name: App with Java inside (${{ matrix.label }})
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: SpreadsheetPro-Windows
          - os: macos-latest
            label: macOS
            asset: SpreadsheetPro-macOS
          - os: ubuntu-latest
            label: Linux
            asset: SpreadsheetPro-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: input

      - name: Work out the version number
        id: ver
        run: |
          V="${TAG#v}"
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then V="1.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build the app (Java is bundled, nothing to install)
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ICON_FLAG=""
            if [ -f "resources/icon.ico" ]; then
              ICON_FLAG="--icon resources/icon.ico"
            fi
            jpackage --type exe --name "Spreadsheet Pro" --app-version "${{ steps.ver.outputs.version }}" \
              --input input --main-jar SpreadsheetPro.jar --main-class SpreadsheetApp \
              --add-modules java.base,java.desktop,java.prefs,java.logging,java.xml,java.naming,jdk.crypto.ec \
              --win-dir-chooser --win-menu --win-shortcut $ICON_FLAG \
              --dest dist
          else
            jpackage --type app-image --name "Spreadsheet Pro" --app-version "${{ steps.ver.outputs.version }}" \
              --input input --main-jar SpreadsheetPro.jar --main-class SpreadsheetApp \
              --add-modules java.base,java.desktop,java.prefs,java.logging,java.xml,java.naming,jdk.crypto.ec \
              --dest dist
          fi

      - name: Package or rename the output
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar -czf "../${{ matrix.asset }}.tar.gz" .
            echo "FILE=${{ matrix.asset }}.tar.gz" >> "$GITHUB_ENV"
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv *.exe "../${{ matrix.asset }}-Setup.exe"
            echo "FILE=${{ matrix.asset }}-Setup.exe" >> "$GITHUB_ENV"
          else
            ditto -c -k --keepParent "Spreadsheet Pro.app" "../${{ matrix.asset }}.zip"
            echo "FILE=${{ matrix.asset }}.zip" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.FILE }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$FILE" --clobber
